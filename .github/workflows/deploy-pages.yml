name: Deploy to GitHub Pages

# Builds on every push to master and force-pushes the built site (dist/) to the
# "pages" branch, which GitHub Pages serves directly -- repo Settings > Pages >
# Build and deployment > Source must be set to "Deploy from a branch" -> pages ->
# / (root). HTTPS on 443 is automatic once that's set; nothing to generate here.
on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time; a new push cancels any in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: pages
